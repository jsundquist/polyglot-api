version: 2

# Version updates only. Security alerts/updates are enabled in repo settings
# and bypass the schedule and cooldown below.
#
# Every entry follows the same policy:
#   - weekly, so a burst of releases becomes one batch of PRs
#   - 7-day cooldown, so a freshly published (possibly malicious) release is
#     never proposed until it has had time to be caught and yanked
#   - minor/patch updates grouped into one PR; majors stay separate PRs so
#     they get a deliberate review
#
# Add go, cargo and nuget entries when those implementations get manifests.
updates:
  - package-ecosystem: npm # also handles pnpm lockfiles
    directory: /typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(typescript)'
    groups:
      typescript-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(python)'
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /contract-tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(contract-tests)'
    groups:
      contract-tests-minor-patch:
        update-types: [minor, patch]

  # Keeps the SHA pins in .github/workflows current (updates the
  # "# vX.Y.Z" comment together with the SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(infra)'
