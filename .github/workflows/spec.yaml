name: OpenAPI Spec CI

permissions:
  contents: read

# Only run when the spec itself changes, on push to main or on any PR into main
on:
  push:
    branches: [main]
    paths:
      - 'spec/spec.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'spec/spec.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history needed so oasdiff can diff against the base branch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint spec
        uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141 # v0.8.13
        with:
          file_glob: 'spec/spec.yaml'

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@9ce3a29eb0e6478dd0140932a678c7fb59d08f22 # v0.1.20
        with:
          base: 'origin/${{ github.base_ref }}:spec/spec.yaml'
          revision: 'HEAD:spec/spec.yaml'
          fail-on: WARN
