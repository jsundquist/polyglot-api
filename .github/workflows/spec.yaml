name: OpenAPI Spec CI

# Only run when the spec itself changes, on push to main or on any PR into main
on:
  push:
    branches: [main]
    paths:
      - 'spec/spec.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'spec/spec.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full history needed so oasdiff can diff against the base branch
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint spec
        uses: stoplightio/spectral-action@latest
        with:
          file_glob: 'spec/spec.yaml'

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: 'origin/${{ github.base_ref }}:spec/spec.yaml'
          revision: 'HEAD:spec/spec.yaml'
          fail-on: WARN