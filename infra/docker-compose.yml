services:
  postgres:
    image: postgres:18-alpine
    container_name: polyglot-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: polyglot
      POSTGRES_PASSWORD: polyglot
      POSTGRES_DB: polyglot_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyglot -d polyglot_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
